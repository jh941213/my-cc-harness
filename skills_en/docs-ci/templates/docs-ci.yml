# docs-ci.yml — docs validation pipeline template
# Install only the jobs matching the project's doc types as .github/workflows/docs-ci.yml
name: Docs CI

on:
  pull_request:
    paths: ["docs/**", "**/*.md", "src/**"]
  push:
    branches: [main]

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments 'docs/**/*.md' '*.md'
          fail: true
        continue-on-error: true # external-link flakes — set false when scoped to internal links

  openapi:
    name: OpenAPI lint + breaking
    runs-on: ubuntu-latest
    if: ${{ hashFiles('docs/api/openapi.yaml') != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Lint
        run: npx --yes @redocly/cli lint docs/api/openapi.yaml
      - name: Breaking changes vs base
        if: github.event_name == 'pull_request'
        run: |
          git show origin/${{ github.base_ref }}:docs/api/openapi.yaml > /tmp/base-openapi.yaml 2>/dev/null || exit 0
          npx --yes oasdiff breaking /tmp/base-openapi.yaml docs/api/openapi.yaml --fail-on ERR

  mermaid:
    name: Mermaid syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract & validate mermaid blocks
        run: |
          mkdir -p /tmp/mmd && i=0
          find docs -name "*.md" -print0 2>/dev/null | while IFS= read -r -d '' f; do
            awk '/^```mermaid/{flag=1;n++;next}/^```/{flag=0}flag{print > "/tmp/mmd/b_" FILENAME "_" n ".mmd"}' FILENAME="$(basename "$f")" "$f" || true
          done
          count=$(find /tmp/mmd -name "*.mmd" 2>/dev/null | wc -l)
          [ "$count" -eq 0 ] && { echo "no mermaid blocks"; exit 0; }
          npm install -g @mermaid-js/mermaid-cli
          fail=0
          for b in /tmp/mmd/*.mmd; do
            mmdc -i "$b" -o /dev/null || { echo "❌ $b"; fail=1; }
          done
          exit $fail

  freshness:
    name: Docs freshness
    runs-on: ubuntu-latest
    if: ${{ hashFiles('docs/docs.yaml') != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Freshness check
        run: bash scripts/check-docs-freshness.sh docs/docs.yaml
        continue-on-error: true # stale = warning; remove to enforce

  doc-touch-policy:
    name: Code-docs co-change policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Warn when API code changed without docs/api
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$CHANGED" | grep -qE '^(src/api/|src/routes/)' && ! echo "$CHANGED" | grep -q '^docs/api/'; then
            echo "::warning::API code changed but docs/api/ was not updated. Consider running /docs api."
          fi
