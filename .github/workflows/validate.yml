# 하네스 자체 CI — 구조 무결성 검증 (docs-ci 스킬의 원칙을 이 레포에 적용)
name: Validate Harness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  structure:
    name: 구조 검증 (frontmatter/JSON/hooks/참조)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate-harness
        run: bash scripts/validate-harness.sh

  shellcheck:
    name: hooks 셸 정적 분석
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091(source 파일 미존재), SC2016(single quote 내 변수) 제외 — hook 특성상 정상
          shellcheck -e SC1091,SC2016 hooks/*.sh scripts/*.sh || exit 1
        continue-on-error: true # 경고 수준 — 문법 오류는 structure 잡의 bash -n이 잡음

  plugin:
    name: 플러그인 매니페스트 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: claude plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
        continue-on-error: true # CLI 설치 실패 시 CI 전체를 막지 않음
